spring:
  application:
    name: alinhaagro-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/alinhaagro}
    username: ${DATABASE_USER:myuser}
    password: ${DATABASE_PASS:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  docker:
    compose:
      enabled: false   # Docker gerenciado manualmente via: cd api && docker compose up -d

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev_secret_must_be_at_least_256_bits_long_for_hs256_algo_ok}
  access-expiration: 900        # 15 minutos em segundos
  refresh-expiration: 604800    # 7 dias em segundos

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.alinhaagro: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR