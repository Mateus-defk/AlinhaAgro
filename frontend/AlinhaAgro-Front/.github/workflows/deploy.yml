name: Deploy — Hostgator (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend para Hostgator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Se usar um bundler (Vite) no futuro, adicionar:
      # - name: Build
      #   working-directory: frontend
      #   run: npm run build
      #   env:
      #     VITE_API_URL: ${{ secrets.API_URL }}
      #     VITE_APP_ENV: production

      - name: Inject runtime config
        run: |
          cat > frontend/env.js << 'EOF'
          window.__ENV__ = {
            API_URL: '${{ secrets.API_URL }}',
            APP_ENV: 'production'
          };
          EOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:            ${{ secrets.FTP_HOST }}
          username:          ${{ secrets.FTP_USER }}
          password:          ${{ secrets.FTP_PASSWORD }}
          local-dir:         ./frontend/
          server-dir:        ${{ secrets.FTP_REMOTE_PATH }}/
          exclude:           |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
          dangerous-clean-slate: false

      - name: Notify deploy success
        if: success()
        run: echo "✅ Deploy concluído em $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Notify deploy failure
        if: failure()
        run: echo "❌ Deploy falhou — verifique os secrets FTP_HOST, FTP_USER, FTP_PASSWORD"

# ── Secrets necessários (configurar em Settings > Secrets > Actions):
# FTP_HOST          → ftp.agrogestao.com.br
# FTP_USER          → usuario@hostgator
# FTP_PASSWORD      → senha FTP
# FTP_REMOTE_PATH   → /public_html
# API_URL           → https://api.agrogestao.com.br/api/v1 (quando o backend estiver no ar)
